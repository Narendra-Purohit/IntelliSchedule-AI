name: Python CI

on:
  push:
    paths:
      - 'ai-services/**'
  pull_request:
    paths:
      - 'ai-services/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd ai-services/document-intelligence
          pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run Tests
        run: |
          cd ai-services/document-intelligence
          pytest tests/ -v
